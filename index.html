*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#f6fbfd;color:#173d68}
.screen{height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#fff 0%,#f4fbfd 55%,#e5f5f9 100%);overflow:hidden}
header{height:13%;flex:none;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:7px solid #34999d;padding:1.4vh 4vw}
.logo{width:min(84%,780px);max-height:9vh;object-fit:contain}

.eye{color:#1384a5;font-weight:900;letter-spacing:5px;font-size:clamp(22px,2.7vw,40px)}

.label{background:linear-gradient(90deg,#1385ad,#21a8b7);color:#fff;text-align:center;padding:1.15vh;font-size:clamp(30px,3.6vw,54px);font-weight:900;letter-spacing:4px}
.body{text-align:center;padding:1.15vh 4vw 1.2vh}

.santa-feature{
  width:100%;
  max-width:940px;
  height:31vh;
  min-height:0;
  position:relative;
  overflow:hidden;
  border-radius:30px;
  border:4px solid #34999d;
  box-shadow:0 12px 30px rgba(23,71,107,.18);
  margin-bottom:1vh;
  background:#dff2f7;
}
.santa-feature img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
}
.santa-caption{
  position:absolute;left:0;right:0;bottom:0;
  padding:1.15vh 3vw;
  text-align:center;color:#fff;
  font-size:clamp(26px,3.2vw,48px);
  font-weight:900;
  background:linear-gradient(180deg,rgba(8,55,78,0),rgba(8,55,78,.92));
}

.novisign-bottom{height:19%;flex:0 0 19%;background:#12528c;display:flex;align-items:center;justify-content:center;padding:0}
.novisign-bottom img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none}

function pretty(k){let a=k.split("-").map(Number);return new Intl.DateTimeFormat("en-CA",{weekday:"long",month:"long",day:"numeric",year:"numeric",timeZone:"America/Halifax"}).format(new Date(Date.UTC(a[0],a[1]-1,a[2],12)))}
function nxt(k){return Object.keys(S).sort().find(x=>x>k&&S[x]!=="No Santa")}
function render(){let k=key(),v=S[k],h=document.getElementById("hours");document.getElementById("date").textContent=pretty(k);h.classList.remove("muted");
if(v){h.textContent=v;if(v==="No Santa")h.classList.add("muted")}else if(k<"2026-11-28"){h.textContent="Santa season begins November 28";h.classList.add("muted")}else if(k>"2026-12-23"){h.textContent="Santa photos have ended";h.classList.add("muted")}else{h.textContent="No Santa scheduled today";h.classList.add("muted")}
let n=nxt(k);document.getElementById("next").textContent=n?pretty(n)+" • "+S[n]:"No additional Santa appearances scheduled."}
render();setInterval(render,60000);
</script></body></html>
